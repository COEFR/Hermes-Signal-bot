name: bot-senales

# Un solo workflow para todo. **No usa ninguna acción de terceros** (ni `checkout` ni `setup-python`):
# clona el repo con `git`, usa el Python que ya trae el runner de Ubuntu y publica con el token
# interno. Así funciona incluso con la política de "solo acciones propias" de esta cuenta.
on:
  schedule:
    # Respaldo: GitHub no baja de 5 minutos y suele atrasarse (medido el 11/10: corridas cada 5-6 h).
    # El reloj puntual es externo (cron-job.org o la VPS) y llama al workflow_dispatch.
    - cron: "*/5 * * * *"
  workflow_dispatch:            # botón para probar a mano (y lo usa el reloj externo)
    inputs:
      probar_entrega:
        description: "Mandar un mensaje de prueba a Discord y Telegram"
        type: boolean
        default: false
      tarea:
        description: "Horario a ejecutar (vacío = ciclo normal). El reloj externo lo usa para el reporte diario y el marcador semanal."
        type: string
        default: ""

permissions:
  contents: write               # necesario para commitear el estado

jobs:
  senales:
    strategy:
      fail-fast: false          # si un perfil falla, los otros siguen
      matrix:
        perfil: [premium, normales, momentum, rebote]
    concurrency:
      group: bot-${{ matrix.perfil }}
      cancel-in-progress: false # si se atrasa, la siguiente espera (no se pisa el estado)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Traer el repo (git clone, sin acciones de terceros)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "bot-senales"
          git config user.email "bot-senales@users.noreply.github.com"

      - name: Dependencias (Pillow para los gráficos)
        run: python3 -m pip install --quiet "pillow>=10,<13"

      - name: Credenciales
        # desde los Secrets del repo (nunca en el código): los scripts leen ~/.hermes/.env
        run: |
          mkdir -p ~/.hermes
          cat > ~/.hermes/.env <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL=${{ secrets.TELEGRAM_HOME_CHANNEL }}
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_HOME_CHANNEL=${{ secrets.DISCORD_HOME_CHANNEL }}
          DISCORD_SIGNALS_CHANNEL=${{ secrets.DISCORD_SIGNALS_CHANNEL }}
          EOF
          chmod 600 ~/.hermes/.env
          echo "claves cargadas: $(wc -l < ~/.hermes/.env)"

      - name: Comprobar que las credenciales llegaron
        # si falta un secreto, la línea queda como "CLAVE=" y la corrida se pone en ROJO
        # (así no pasa el peor caso: corrida verde que no envía nada)
        run: |
          vacias=$(grep -c '=$' ~/.hermes/.env || true)
          echo "claves con valor: $(grep -c '=.\+' ~/.hermes/.env || true) de 5"
          if [ "$vacias" != "0" ]; then
            echo "::error::Faltan secretos del repositorio (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Prueba de entrega (solo si la pedís al disparar)
        # ojo: NO puede dispararse en cada llamada del reloj (mandaría un mensaje de prueba cada 15 min)
        if: github.event_name == 'workflow_dispatch' && inputs.probar_entrega
        working-directory: repo
        run: python3 dev/prueba_entrega.py

      - name: Correr el perfil ${{ matrix.perfil }}
        working-directory: repo
        env:
          SCHEDULE: ${{ inputs.tarea || github.event.schedule }}
        run: python3 gh_run.py ${{ matrix.perfil }}

      - name: Guardar el estado del perfil
        working-directory: repo
        run: |
          git add -A -- "state_${{ matrix.perfil }}.json" || true
          if git diff --cached --quiet; then
            echo "sin cambios de estado"
            exit 0
          else
            git commit -m "estado ${{ matrix.perfil }} $(date -u '+%Y-%m-%d %H:%M UTC')"
            # REBASE + REINTENTO: si alguien (o yo, desde la máquina) empujó cambios mientras el ciclo
            # corría, el push directo se rechaza y la corrida entera quedaba en rojo (pasó en #501 y
            # #502). Con pull --rebase --autostash y 3 intentos, el bot se reajusta solo.
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "estado guardado"; break
              fi
              echo "push rechazado, reintento $i…"
              sleep 5
            done
          fi

      - name: Avisar por Discord si algo falló
        if: failure()
        run: |
          curl -s -o /dev/null -X POST \
            "https://discord.com/api/v10/channels/${{ secrets.DISCORD_HOME_CHANNEL }}/messages" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"content":"⚠️ El perfil ${{ matrix.perfil }} del bot de señales falló en GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  seguimiento:
    concurrency:
      group: bot-seguimiento
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Traer el repo (git clone, sin acciones de terceros)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "bot-senales"
          git config user.email "bot-senales@users.noreply.github.com"

      - name: Dependencias (Pillow para los gráficos)
        run: python3 -m pip install --quiet "pillow>=10,<13"

      - name: Credenciales
        run: |
          mkdir -p ~/.hermes
          cat > ~/.hermes/.env <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL=${{ secrets.TELEGRAM_HOME_CHANNEL }}
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_HOME_CHANNEL=${{ secrets.DISCORD_HOME_CHANNEL }}
          DISCORD_SIGNALS_CHANNEL=${{ secrets.DISCORD_SIGNALS_CHANNEL }}
          EOF
          chmod 600 ~/.hermes/.env

      - name: Prueba de entrega (solo si la pedís al disparar)
        if: github.event_name == 'workflow_dispatch' && inputs.probar_entrega
        working-directory: repo
        run: python3 dev/prueba_entrega.py

      - name: Contexto de mercado y seguimiento
        working-directory: repo
        env:
          SCHEDULE: ${{ inputs.tarea || github.event.schedule }}
        run: python3 gh_run.py "contexto de mercado" seguimiento

      - name: Guardar estado y el informe del ciclo
        working-directory: repo
        run: |
          git add -A -- state.json ultimo_ciclo.txt ultimas_tareas.json || true
          if git diff --cached --quiet; then
            echo "sin cambios de estado"
            exit 0
          else
            git commit -m "estado seguimiento $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4; do
              if git pull --rebase --autostash origin main && git push; then
                echo "estado guardado"; break
              fi
              echo "push rechazado, reintento $i…"
              sleep 4
            done
          fi

      - name: Avisar por Discord si algo falló
        if: failure()
        run: |
          curl -s -o /dev/null -X POST \
            "https://discord.com/api/v10/channels/${{ secrets.DISCORD_HOME_CHANNEL }}/messages" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"content":"⚠️ El seguimiento del bot falló en GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  alerta:
    # Aviso cuando CUALQUIER job falla: entrega rechazada, error de escaneo, etc.
    # senales.py ahora sale con codigo 3 si una entrega devuelve ok=False.
    needs: [senales, seguimiento]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar por Discord
        run: |
          curl -s -o /dev/null -X POST \
            "https://discord.com/api/v10/channels/${{ secrets.DISCORD_HOME_CHANNEL }}/messages" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"content":"ALERTA: el bot de senales fallo. Revisar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
